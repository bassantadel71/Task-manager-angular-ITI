<h5 class="fw-bold mb-3">All Tasks</h5>

@for (task of tasks; track task.id) {
  <app-task-card
    [task]="task"
    (markDone)="markDone.emit($event)"
    (markDeleted)="markDeleted.emit($event)"
  />
} @empty {
  <div class="text-center text-muted mt-5">
    <p>No tasks yet. <a routerLink="/main/add-task">Add one!</a></p>
  </div>
}
